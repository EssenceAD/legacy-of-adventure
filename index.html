<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#07091a" />
    <title>모험의 유산</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="모험의 유산" />
  </head>
  <body>
    <div id="view">
      <canvas id="scene"></canvas>
      <div id="over"></div>
      <div id="flash"></div>

      <div id="hud" hidden>
        <div class="top">
          <div class="stat px">
            <div class="nm" id="innv">여관</div>
            <div class="r1">
              <span><i class="coin"></i><span id="gold"><span id="goldv">0</span></span></span>
              <span id="dayv">1일차 · 06시</span>
              <span id="starv" class="star">★1</span>
            </div>
          </div>
          <div class="sp"></div>
          <button class="ibtn px" id="bNotice" aria-label="새 소식">!<span class="dot" hidden></span></button>
          <button class="ibtn px" id="bDN" aria-label="낮과 밤">☾</button>
          <button class="ibtn px" id="bMenu" aria-label="메뉴">≡</button>
        </div>
        <div id="toast" class="px"></div>
        <div id="visitbar" class="px" hidden><span id="vName"></span><button id="vLike">♥</button><button id="vHome">집으로</button></div>
        <div id="runbar" hidden></div>
        <div id="chatlog" aria-label="채팅 열기"></div>
        <nav class="dk px">
          <button id="bOwner"><img class="kic" src="assets/icons/m_owner.png" alt="" />주인</button>
          <button id="bBuild"><img class="kic" src="assets/icons/m_smith.png" alt="" />건설</button>
          <button id="bExp"><img class="kic" src="assets/icons/m_expedition.png" alt="" />원정</button>
          <button id="bGuest"><img class="kic" src="assets/icons/m_guests.png" alt="" />손님</button>
          <button id="bVillage"><img class="kic" src="assets/icons/m_neighbor.png" alt="" /><span class="lbl">마을</span></button>
          <button id="bMenu2"><img class="kic" src="assets/icons/m_settings.png" alt="" />메뉴</button>
        </nav>
        <div id="placebar" class="px" hidden>
          <p id="placeTxt">지을 곳을 눌러요</p>
          <p id="placeWhy" hidden></p>
          <div class="pbtns"><button id="placeNo">✕ 취소</button><button id="placeRot">↻ 회전</button><button id="placeOk">✓ 확정</button></div>
        </div>
        <button class="ibtn px" id="bZoom" aria-label="확대 배율">×2</button>
      </div>

      <div id="scrim"></div>
      <section class="win px" id="win" role="dialog" aria-modal="true">
        <div class="hd"><b id="winT"></b><button id="winX" aria-label="닫기">✕</button></div>
        <div id="winB"></div>
      </section>

      <div id="dlg" hidden>
        <div class="keys">Z NEXT<button id="dSkip">X SKIP</button></div>
        <div id="dDuo" hidden><img id="dDuoL" alt="" /><img id="dDuoR" alt="" /></div>
        <div class="box px"><img id="dPort" alt="" /><span id="dName"></span><p id="dText"></p><span class="more">▼</span></div>
        <div id="dChoice" hidden></div>
      </div>
      <div id="namebox" class="px" hidden>
        <b>새 간판에 쓸 여관 이름</b>
        <div class="row"><input id="nameIn" maxlength="8" placeholder="예) 별빛" autocomplete="off" /><button id="nameOk">결정</button></div>
      </div>

      <div id="title">
        <div class="logo">
          <div class="ko">모험의 유산</div>
          <div class="en">LEGACY OF ADVENTURE</div>
          <span class="ch">제1장 · 은퇴한 주인의 여관</span>
        </div>
        <div class="tbtns">
          <button class="px" id="tStart">새 여관 열기<small>오프닝부터</small></button>
          <button class="px" id="tCont">이어하기<small id="tContSub">저장된 마을이 없어요</small></button>
        </div>
        <div class="ver">v0.5.2</div>
      </div>
      <div id="loading">불러오는 중…</div>
      <div id="fade"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
